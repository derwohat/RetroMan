# Production compose - uses pre-built image from ghcr.io (no local build needed)
# For Synology Container Manager / Dockhand - single file, no extra files needed.
#
# Setup:
#   1. Put the values below into a .env file next to this one, or into the
#      stack manager's variable form. Both work: every value is a ${...},
#      which is also what makes the form offer a field for it.
#   2. docker compose up -d
#
# Four values have no default and must be set, or compose stops right away and
# says which one is missing: POSTGRES_PASSWORD, NEXTAUTH_URL, NEXTAUTH_SECRET,
# ENCRYPTION_KEY. See .env.example for how to generate them.

# The project name decides the prefix of every container and network. Without
# it compose derives one from the DIRECTORY, so moving the stack - which a
# stack manager does readily, into /app/data/stacks/<name> - silently builds a
# second, empty set beside the old one.
name: retroman

# Docker never rotates container logs on its own, so without a limit they grow
# until the disk is full — an outage that has nothing to do with the app and
# is noticed last. One anchor rather than a copy per service, so the limit
# stays a single decision. Adjustable via .env when more log is needed for
# chasing a problem.
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "${LOG_MAX_SIZE:-10m}"
      max-file: "${LOG_MAX_FILES:-3}"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    <<: *logging
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-retroman}
      - POSTGRES_USER=${POSTGRES_USER:-retroman}
      # Example: MeinSicheresPasswort42!
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt — siehe .env.example}
    volumes:
      - "./data/postgres:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-retroman}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    # Pin the version in .env next to this file: RETROMAN_VERSION=1.3.0
    # With "latest" every restart may pull a different image and rolling back
    # after a bad release is impossible — you cannot even name the version you
    # were on. latest stays the fallback for a first start only.
    image: ghcr.io/derwohat/retroman:${RETROMAN_VERSION:-latest}
    restart: unless-stopped
    <<: *logging
    ports:
      # Reachable from this machine only, unless you say otherwise. A reverse
      # proxy on the same host reaches it either way — its target is localhost.
      # To use RetroMan directly from other machines on the network, set
      # RETROMAN_BIND=0.0.0.0. That is a decision, not a default: a plain
      # "7007:7007" publishes on every interface, which is rarely what anyone
      # chose on purpose.
      - "${RETROMAN_BIND:-127.0.0.1}:${RETROMAN_PORT:-7007}:7007"
    environment:
      # Built from the three values above, so the password lives in one place.
      # It used to be spelled out a second time here, with a comment asking to
      # keep both in step — which is a request, not a mechanism.
      - DATABASE_URL=postgresql://${POSTGRES_USER:-retroman}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt — siehe .env.example}@db:5432/${POSTGRES_DB:-retroman}
      # IP or hostname of this machine (with port), or reverse proxy domain
      # (without port).
      #   Example direct:        http://192.168.1.100:7007
      #   Example reverse proxy: https://retroman.deine-domain.de
      - NEXTAUTH_URL=${NEXTAUTH_URL:?NEXTAUTH_URL fehlt — siehe .env.example}
      # 32 random bytes as base64, and 64 hex characters. Two different
      # formats; they are not interchangeable. Commands in .env.example.
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?NEXTAUTH_SECRET fehlt — siehe .env.example}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY fehlt — siehe .env.example}
      - NODE_ENV=production
      # Required when accessed via reverse proxy or external domain
      - AUTH_TRUST_HOST=true
      #
      # ─── Optional: mail, for the "forgot password" link ──────────────────
      # Leave SMTP_HOST empty and the feature simply stays off: the link is
      # not shown on the sign-in page and its pages return 404. Everything
      # else works unchanged. Filling it in is all that is needed to switch
      # it on — an admin can still issue a temporary password either way.
      - SMTP_HOST=${SMTP_HOST:-}
      # 587 rather than an empty default: an empty value is not the same as an
      # unset one, and a port that reads as empty becomes port 0.
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      # "false" only for a server that cannot do STARTTLS on port 587
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
      # Must be a real address, not just a display name — servers reject those
      - SMTP_FROM=${SMTP_FROM:-}
      # The address reset links point at. Empty means NEXTAUTH_URL is used,
      # which is normally the same — set this only where the two differ.
      - APP_BASE_URL=${APP_BASE_URL:-}
    volumes:
      - "./data/uploads:/app/uploads"
    depends_on:
      db:
        condition: service_healthy

# Data is stored in ./data/ next to this file — back up that folder with Hyper Backup.
# Docker creates subdirectories automatically on first start.
