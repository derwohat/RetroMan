# Production compose - uses pre-built image from ghcr.io (no local build needed)
# For Synology Container Manager / Dockhand - single file, no extra files needed.
#
# Setup:
#   1. Replace all example values below with your own
#   2. docker compose up -d

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: retroman
      POSTGRES_USER: retroman
      # Example: MeinSicheresPasswort42!
      POSTGRES_PASSWORD: CHANGE_ME
    volumes:
      - "./data/postgres:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retroman"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    # Pin the version in .env next to this file: RETROMAN_VERSION=0.10.1
    # With "latest" every restart may pull a different image and rolling back
    # after a bad release is impossible — you cannot even name the version you
    # were on. latest stays the fallback for a first start only.
    image: ghcr.io/derwohat/retroman:${RETROMAN_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "7007:7007"
    environment:
      # Same password as POSTGRES_PASSWORD above
      # Example: postgresql://retroman:MeinSicheresPasswort42!@db:5432/retroman
      DATABASE_URL: postgresql://retroman:CHANGE_ME@db:5432/retroman
      # IP or hostname of this machine (with port), or reverse proxy domain (without port)
      # Example direct:        http://192.168.1.100:7007
      # Example reverse proxy: https://retroman.deine-domain.de
      NEXTAUTH_URL: http://CHANGE_ME:7007
      # Random secret - generate with: openssl rand -base64 32
      # Example: hX3kL9mZqR7vW2nYpT5uA8eB6cD4fG0j1iO+sN/KQw=
      NEXTAUTH_SECRET: CHANGE_ME
      # Exactly 64 hex characters - generate with: openssl rand -hex 32
      # Example: a3f8c2d1e4b5a6f7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1
      ENCRYPTION_KEY: CHANGE_ME_64HEX
      NODE_ENV: production
      # Required when accessed via reverse proxy or external domain (e.g. Synology QuickConnect)
      AUTH_TRUST_HOST: "true"
      #
      # ─── Optional: mail, for the "forgot password" link ──────────────────
      # Leave these out entirely and the feature simply stays off: the link is
      # not shown on the sign-in page and its pages return 404. Everything
      # else works unchanged. Filling them in is all that is needed to switch
      # it on — an admin can still issue a temporary password either way.
      # SMTP_HOST: smtp.deine-domain.de
      # SMTP_PORT: 587
      # SMTP_USER: retroman@deine-domain.de
      # SMTP_PASSWORD: CHANGE_ME
      # Set to "false" only for a server that cannot do STARTTLS on port 587
      # SMTP_USE_TLS: "true"
      # Must be a real address, not just a display name — servers reject those
      # SMTP_FROM: RetroMan <retroman@deine-domain.de>
      # The address reset links point at. Without it they point at localhost
      # and are useless in a mail someone receives.
      # APP_BASE_URL: https://retroman.deine-domain.de
    volumes:
      - "./data/uploads:/app/uploads"
    depends_on:
      db:
        condition: service_healthy

# Data is stored in ./data/ next to this file — back up that folder with Hyper Backup.
# Docker creates subdirectories automatically on first start.
