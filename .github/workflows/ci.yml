name: CI & Docker Publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint, Typecheck & Prisma Validate
    runs-on: ubuntu-latest
    steps:
      # Node 20 is gone as an Actions runtime, so every action that still ran
      # on it warned on each run. setup-node is in here although the suite's
      # target list leaves it out: that list was written from a workflow with
      # no test job, and v4 runs on Node 20 just the same.
      - uses: actions/checkout@v7

      # v5 caches automatically when package.json names a packageManager, and
      # v6 narrows that to npm. Neither applies here: there is no such field,
      # and the cache is asked for explicitly below.
      # The same Node as the image (docker/Dockerfile), so lint and typecheck
      # see what production runs.
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # The reminder in version-check.yml only runs weekly; a broken date rule
      # would stay silent until then. Built-in test runner, nothing to install.
      - name: Test version-check script
        run: node --test .github/scripts/version-check-due.test.mjs

      - name: Validate Prisma schema
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy

  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: check
    # Only a version tag publishes an image. A release pushes main and then
    # the tag, and both used to run this job: two builds of the same commit,
    # two different digests, and :latest pointing at the one the version tag
    # did not. Pushing main now runs the checks above and nothing more.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # latest used to follow the newest commit on main, so an untagged
          # work-in-progress could become :latest without anyone choosing it.
          # It now follows the newest release, and a pre-release tag such as
          # v1.3.0-rc1 leaves it alone.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
